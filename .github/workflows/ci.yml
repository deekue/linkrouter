# Continuous integration for LinkRouter.
#
# Runs on every pull request (and branch push) to catch build/lint/test
# regressions before they reach a release. Unsigned build only — no secrets
# needed, which is consistent with app/build.gradle.kts: when the RELEASE_*
# values are absent the release build type is simply left unsigned.

name: CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'docs/**'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            actions:
              - '.github/workflows/**'
            app:
              - 'app/**'
              - 'gradle/**'
            docs:
              - 'docs/**'
              - '*.md'
              - 'LICENSE'

  actionlint:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  build-and-test-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Build, Lint, Test (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (API 36, build-tools 36.0.0)
        shell: bash
        run: |
          set -euo pipefail

          # ---- Choose ONE consistent SDK root for the whole job ---------------
          # We no longer assume the runner preinstalls cmdline-tools in a path we
          # can trust (that caused the original failure). If ANDROID_SDK_ROOT is
          # already set and points at a usable cmdline-tools (fast path), keep it;
          # otherwise install everything into a home-directory SDK root that the
          # job user can always write to. ANDROID_HOME always mirrors
          # ANDROID_SDK_ROOT so Gradle and the tooling agree on one location.
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          else
            export ANDROID_SDK_ROOT="${HOME}/.android-sdk"
            export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          fi
          export ANDROID_SDK_ROOT ANDROID_HOME
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          # ---- Ensure command-line tools are present (idempotent) -------------
          if [ ! -x "${SDKMANAGER}" ]; then
            echo "cmdline-tools not found at ${SDKMANAGER}; downloading official build 11076708..."
            SDK_TMP="$(mktemp -d)"
            curl -fsSL -o "${SDK_TMP}/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            if command -v unzip > /dev/null 2>&1; then
              unzip -q -o "${SDK_TMP}/cmdline-tools.zip" -d "${SDK_TMP}"
            else
              python3 -m zipfile -e "${SDK_TMP}/cmdline-tools.zip" "${SDK_TMP}"
            fi
            # The zip unpacks to cmdline-tools/<version>/; normalize onto .../latest.
            rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            mv "${SDK_TMP}/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            rm -rf "${SDK_TMP}"
          fi

          # Make the tooling available for THIS step.
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          # ---- Accept licenses, then install the packages we need -------------
          # Licenses first; sdkmanager --install needs them accepted. Under
          # `set -o pipefail`, a plain `yes | sdkmanager --licenses` returns 141
          # (`yes` dies on SIGPIPE after the prompts are answered), which would
          # fail the step, so guard it as non-fatal; a real failure resurfaces at
          # the --install call right after.
          yes | "${SDKMANAGER}" --licenses 2>&1 || echo "::warning::'sdkmanager --licenses' exited non-zero (expected once licenses are accepted); continuing."
          "${SDKMANAGER}" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

          # ---- Persist environment for the Gradle steps that follow -----------
          # A plain `run:` step does NOT leak exports to later steps; GITHUB_ENV /
          # GITHUB_PATH do. This is what lets setup-gradle / assemble / lint /
          # test actually see the SDK.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # ---- Diagnostics for the logs ---------------------------------------
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          "${SDKMANAGER}" --version
          ls -la "${ANDROID_SDK_ROOT}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          # NOTE: add gradle/libs.versions.toml and init.gradle to hashFiles if/when introduced
          key: cc-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: cc-${{ runner.os }}-

      - name: Build release (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: docs
    env:
      # Define tool versions
      DART_SASS_VERSION: 1.102.0
      GO_VERSION: 1.26.5
      HUGO_VERSION: 0.165.0
      NODE_VERSION: 24.19.0

      # Set the build time zone
      TZ: Australia/Melbourne
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('docs/go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('docs/package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          command -v sass &> /dev/null && echo "Dart Sass: $(sass --version)" || echo "Dart Sass: not installed"
          command -v go &> /dev/null && echo "Go: $(go version)" || echo "Go: not installed"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"
          command -v node &> /dev/null && echo "Node.js: $(node --version)" || echo "Node.js: not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the project..."
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: docs/public

  deploy-docs:
    needs: [changes, build-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
